<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Page Web App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Digital Clock Section -->
        <div class="clock-section">
            <div class="digital-clock">
                <p id="date">2025/05/03</p>
                <p id="day" class="highlight">Saturday</p>
                <p id="time">08:15:33 AM</p>
            </div>
            <div class="progress-circle">
                <svg>
                    <circle cx="50" cy="50" r="45"></circle>
                    <circle class="progress" cx="50" cy="50" r="45"></circle>
                </svg>
                <p class="progress-text">35:04</p>
            </div>
        </div>

        <!-- Task Schedule Section -->
        <div class="task-schedule">
            <ul>
                <li>
                    <div class="task-time">7:30-8:15</div>
                    <div class="task-details">起床，洗漱</div>
                </li>
                <li>
                    <div class="task-time">8:35-9:20</div>
                    <div class="task-details">吃早餐</div>
                </li>
                <!-- Add more tasks as needed -->
            </ul>
        </div>

        <!-- Button Panel -->
        <div class="button-panel">
            <button class="btn">确认键</button>
            <button class="btn">时钟键</button>
            <button class="btn">闹钟键</button>
            <button class="btn">音量键</button>
            <button class="btn">开关键</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
